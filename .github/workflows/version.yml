name: Validar e versionar
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm run check
      - run: npm run test:ci
      - run: npm run test:backup
      - name: Testar versionamento do banco em PostgreSQL isolado
        run: |
          npm install --prefix "$RUNNER_TEMP/db-version-tests" --save-exact @electric-sql/pglite@0.3.14
          PGLITE_MODULE_PATH="$RUNNER_TEMP/db-version-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/release-versioning.mjs
          PGLITE_MODULE_PATH="$RUNNER_TEMP/db-version-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/list-read-performance.mjs
          PGLITE_MODULE_PATH="$RUNNER_TEMP/db-version-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/workspace-read-batch.mjs
          PGLITE_MODULE_PATH="$RUNNER_TEMP/db-version-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/derived-sales-cache.mjs
          PGLITE_MODULE_PATH="$RUNNER_TEMP/db-version-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/preparation-pages.mjs --catalog-cache
          PGLITE_MODULE_PATH="$RUNNER_TEMP/db-version-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/preparation-catalog-signature.mjs
          PGLITE_MODULE_PATH="$RUNNER_TEMP/db-version-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/llm-invoice-drafts.mjs supabase/migrations/20261011172215_llm_invoice_drafts_human_approval.sql supabase/migrations/20261011192921_invoice_review_receiving.sql supabase/migrations/20261011195918_invoice_line_item_type.sql supabase/migrations/20261011195920_invoice_line_category.sql supabase/migrations/20261020215843_invoice_human_document_classification.sql
          PGLITE_MODULE_PATH="$RUNNER_TEMP/db-version-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/order-receiving.mjs
          PGLITE_MODULE_PATH="$RUNNER_TEMP/db-version-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/edit-waste.mjs
          PGLITE_MODULE_PATH="$RUNNER_TEMP/db-version-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/whatsapp-waste.mjs
          PGLITE_MODULE_PATH="$RUNNER_TEMP/db-version-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/whatsapp-preparation.mjs
          node supabase/tests/count-drafts.mjs "$RUNNER_TEMP/db-version-tests/node_modules/@electric-sql/pglite/dist/index.js"
      - name: Testar falhas e recuperação de salvamentos no navegador
        run: |
          npm install --prefix "$RUNNER_TEMP/count-browser-tests" --save-exact playwright@1.56.1
          "$RUNNER_TEMP/count-browser-tests/node_modules/.bin/playwright" install --with-deps chromium
          PORT=4196 node server.mjs > "$RUNNER_TEMP/count-browser-server.log" 2>&1 &
          COUNT_SERVER_PID=$!
          trap 'kill "$COUNT_SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4196/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/browser/count-reliability.mjs "$RUNNER_TEMP/count-browser-tests/node_modules/playwright/index.mjs"
          node tests/browser/save-reliability.mjs "$RUNNER_TEMP/count-browser-tests/node_modules/playwright/index.mjs"
          node tests/browser/all-forms-save-feedback.mjs "$RUNNER_TEMP/count-browser-tests/node_modules/playwright/index.mjs"
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Criar versão desta atualização
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v0.1.${RUN_NUMBER}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "A versão $VERSION já existe; nenhuma duplicata foi criada."
          else
            gh release create "$VERSION" --target "$COMMIT_SHA" --title "$VERSION" --generate-notes
          fi
