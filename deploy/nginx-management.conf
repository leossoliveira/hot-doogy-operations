# Included from nginx's http context through sites-enabled.
# Empty keys are not counted, so the stricter budget affects only login.
map $uri $hot_doogy_login_limit_key {
    default "";
    /api/auth/login $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=hot_doogy_entry:10m rate=30r/s;
limit_req_zone $hot_doogy_login_limit_key zone=hot_doogy_login:10m rate=5r/m;
# Preserve unexpected origins; translate only the verified public origin.
map $http_origin $hot_doogy_backend_origin {
    default $http_origin;
    "https://management.hotdoogy.com" "http://127.0.0.1:4173";
}
map "$request_method:$http_origin" $hot_doogy_bad_origin {
    default 1;
    ~^(GET|HEAD): 0;
    "POST:https://management.hotdoogy.com" 0;
    "PUT:https://management.hotdoogy.com" 0;
    "PATCH:https://management.hotdoogy.com" 0;
    "DELETE:https://management.hotdoogy.com" 0;
}

server {
    listen 80;
    listen [::]:80;
    server_name management.hotdoogy.com;
    # Trust visitor IP headers only from official Cloudflare proxy networks.
    # Source: https://www.cloudflare.com/ips/ (retrieved 2026-10-19).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hot-doogy-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://management.hotdoogy.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name management.hotdoogy.com;
    # Trust visitor IP headers only from official Cloudflare proxy networks.
    # Source: https://www.cloudflare.com/ips/ (retrieved 2026-10-19).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    ssl_certificate /etc/letsencrypt/live/management.hotdoogy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/management.hotdoogy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HotDoogyTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 21m;
    limit_req zone=hot_doogy_entry burst=100 nodelay;
    limit_req zone=hot_doogy_login burst=10 nodelay;
    limit_req_status 429;

    if ($host != management.hotdoogy.com) { return 444; }
    if ($hot_doogy_bad_origin) { return 403; }

    location / {
        auth_basic off;
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:4173;
        proxy_set_header Origin $hot_doogy_backend_origin;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_cookie_flags hd_session secure httponly samesite=strict;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
