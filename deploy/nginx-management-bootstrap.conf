# Initial HTTP configuration used only to obtain the first certificate.
server {
    listen 80;
    listen [::]:80;
    server_name management.hotdoogy.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hot-doogy-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://management.hotdoogy.com$request_uri; }
}
